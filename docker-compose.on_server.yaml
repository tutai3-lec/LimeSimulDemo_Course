services:
  lime_simul_demo:
    image: course_lime-image
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        ROS_DISTRO: humble
          #network_mode: host
    ports:
      - "127.0.0.1:5901:5901"
    privileged: true
    ipc: host
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility
      - VGL_DISPLAY=egl
      - TVNC_WM=startxfce4
    volumes:
      - ./pytwb_ws:/root/pytwb_ws:rw
      - ./bin:/root/bin:rw
      - ./roscommon:/root/roscommon:rw
      - ./practice_ws:/root/practice_ws:rw
    command: >
      bash -c "
      rm -rf /tmp/.X1-lock /tmp/.X11-unix/X1 /root/.vnc/*.pid &&
      vncserver :1 -geometry 1920x1080 -depth 24 &&
      tail -f /dev/null
      "
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics]
